name: Coverity on Polaris

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  coverity-on-polaris:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Validate build without tests
        run: ./mvnw -B -Dmaven.test.skip=true package

      - name: Download Polaris CLI
        env:
          POLARIS_SERVER_URL: ${{ secrets.POLARIS_SERVER_URL }}
        run: |
          curl -fLsS \
            -o polaris_cli-linux64.zip \
            "${POLARIS_SERVER_URL}/api/tools/polaris_cli-linux64.zip"

          mkdir -p "${RUNNER_TEMP}/polaris-cli"

          unzip -jo polaris_cli-linux64.zip \
            -d "${RUNNER_TEMP}/polaris-cli"

          chmod +x "${RUNNER_TEMP}/polaris-cli/polaris"

      - name: Run Coverity on Polaris scan
        env:
          POLARIS_SERVER_URL: ${{ secrets.POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        run: |
          "${RUNNER_TEMP}/polaris-cli/polaris" analyze -w

      - name: Upload Coverity capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverity-build-log
          path: .blackduck/polaris/data/coverity/*/idir/build-log.txt
          if-no-files-found: ignore
