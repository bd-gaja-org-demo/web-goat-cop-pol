name: Coverity on Polaris

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  coverity-on-polaris:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Download Polaris CLI
        env:
          POLARIS_SERVER_URL: ${{ secrets.POLARIS_SERVER_URL }}
        run: |
          set -euxo pipefail

          test -n "$POLARIS_SERVER_URL" || {
            echo "::error::POLARIS_SERVER_URL is empty"
            exit 1
          }

          curl -fLsS \
            -o polaris_cli-linux64.zip \
            "${POLARIS_SERVER_URL}/api/tools/polaris_cli-linux64.zip"

          mkdir -p "${RUNNER_TEMP}/polaris-cli"

          unzip -jo polaris_cli-linux64.zip \
            -d "${RUNNER_TEMP}/polaris-cli"

          chmod +x "${RUNNER_TEMP}/polaris-cli/polaris"

          "${RUNNER_TEMP}/polaris-cli/polaris" --version

      - name: Verify Polaris and Coverity configuration
        run: |
          set -euxo pipefail

          pwd
          ls -la

          test -f coverity.yaml || {
            echo "::error::coverity.yaml is missing from the repository root"
            exit 1
          }

          test -f polaris.yml || {
            echo "::error::polaris.yml is missing from the repository root"
            exit 1
          }

          echo "----- coverity.yaml -----"
          cat coverity.yaml

          echo "----- polaris.yml -----"
          cat polaris.yml

      - name: Run Coverity on Polaris scan
        env:
          POLARIS_SERVER_URL: ${{ secrets.POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        run: |
          set -euxo pipefail
          "${RUNNER_TEMP}/polaris-cli/polaris" analyze -w

      - name: Upload Coverity diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverity-diagnostics
          path: |
            .blackduck/polaris/configuration/resolved-polaris.yml
            .blackduck/polaris/data/coverity/*/idir/build-log.txt
            .blackduck/polaris/data/coverity/*/idir/replay-log.txt
          if-no-files-found: ignore
